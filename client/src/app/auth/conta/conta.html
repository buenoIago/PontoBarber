<section class="mx-auto" style="max-width: 32rem">
  <h1 class="h3">Minha conta</h1>

  @if (conta(); as usuario) {
    <dl class="row">
      <dt class="col-sm-4">Nome</dt>
      <dd class="col-sm-8">{{ usuario.nomeCompleto }}</dd>

      <dt class="col-sm-4">E-mail</dt>
      <dd class="col-sm-8">{{ usuario.email }}</dd>

      <dt class="col-sm-4">Telefone</dt>
      <dd class="col-sm-8">{{ usuario.telefone ?? 'Não informado' }}</dd>

      <dt class="col-sm-4">Perfil</dt>
      <dd class="col-sm-8">{{ usuario.tipo }}</dd>
    </dl>

    <h2 class="h5 mt-4">Alterar senha</h2>

    <form (submit)="alterarSenha(); $event.preventDefault()">
      <app-form-field id="senhaAtual" rotulo="Senha atual" [obrigatorio]="true">
        <input
          id="senhaAtual"
          type="password"
          class="form-control"
          autocomplete="current-password"
          [value]="senhaAtual()"
          (input)="senhaAtual.set($any($event.target).value)"
          required
        />
      </app-form-field>

      <app-form-field id="novaSenha" rotulo="Nova senha" [obrigatorio]="true">
        <input
          id="novaSenha"
          type="password"
          class="form-control"
          autocomplete="new-password"
          [value]="novaSenha()"
          (input)="novaSenha.set($any($event.target).value)"
          required
        />
      </app-form-field>

      <app-form-field id="confirmarNovaSenha" rotulo="Confirmar nova senha" [obrigatorio]="true">
        <input
          id="confirmarNovaSenha"
          type="password"
          class="form-control"
          autocomplete="new-password"
          [value]="confirmarNovaSenha()"
          (input)="confirmarNovaSenha.set($any($event.target).value)"
          required
        />
      </app-form-field>

      <div class="d-grid">
        <app-button tipo="submit">Salvar senha</app-button>
      </div>
    </form>

    <div class="d-grid mt-3">
      <app-button variante="outline" (click)="sair()">Sair</app-button>
    </div>
  } @else {
    <p>Carregando dados da conta...</p>
  }
</section>
