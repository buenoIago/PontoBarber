<section class="mx-auto" style="max-width: 32rem">
  <h1 class="h3">Entrar</h1>

  <form (submit)="entrar(); $event.preventDefault()">
    <app-form-field id="login-email" rotulo="E-mail" [obrigatorio]="true">
      <input
        id="login-email"
        name="email"
        type="email"
        class="form-control"
        autocomplete="email"
        [value]="email()"
        (input)="alterarEmail($event)"
        required
      />
    </app-form-field>

    <app-form-field id="login-senha" rotulo="Senha" [obrigatorio]="true">
      <input
        id="login-senha"
        name="senha"
        type="password"
        class="form-control"
        autocomplete="current-password"
        [value]="senha()"
        (input)="alterarSenha($event)"
        required
      />
    </app-form-field>

    <div class="d-grid">
      <app-button tipo="submit">Entrar</app-button>
    </div>
  </form>

  <button type="button" class="btn btn-link mt-3" (click)="voltar.emit()">Voltar</button>
</section>
