# deploy/nginx/default.conf
#
# Arquivo renderizado com envsubst na imagem web (tarefa 2.1+):
#   envsubst '${API_UPSTREAM}' \
#     < /etc/nginx/templates/default.conf.template \
#     > /etc/nginx/conf.d/default.conf
#
# API_UPSTREAM = host:porta da API, sem esquema (ex.: api:8080).
# O valor padrao sera definido pela imagem web, sem fixar provedor ou plataforma.
# HTTP na porta 80 apenas para validacao local; TLS/HSTS ficam sob a ADR-028.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /health/live e /health/ready sao internos (TDD 10.2): nao expor publicamente.
    location = /health {
        return 404;
    }

    location ^~ /health/ {
        return 404;
    }

    # TDD 5.2: SPA e API na mesma origem; o prefixo /api e preservado no proxy.
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    # Rotas do Angular: fallback para index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
