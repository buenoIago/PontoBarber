# PostgreSQL local do PontoBarber (infraestrutura da etapa de migração).
# Credenciais reais devem ficar em .env na raiz do repositório (fora do Git).
services:
  postgres:
    image: postgres:16.8-alpine
    container_name: PontoBarber-Postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pontobarber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: pontobarber
    ports:
      - "5432:5432"
    volumes:
      - pontobarber-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pontobarber} -d pontobarber"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pontobarber-postgres-data:
